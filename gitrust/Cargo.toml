[package]
name = "gitrust"
version = "0.4.1"
edition = "2021"
description = "A safety layer for Git: plain-English Git operations with deterministic guardrails, undo protection and lost-work recovery, routed by a local decision model (Kev)"
license = "MIT"
repository = "https://github.com/Aniketdalvi385/gitrust"
readme = "README.md"
keywords = ["git", "cli", "safety", "recovery", "local-model"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap        = { version = "4.5",  features = ["derive"] }
git2        = "0.20"
libgit2-sys = { version = "0.18", features = ["vendored"] }
reqwest     = { version = "0.12", features = ["json"] }
tokio       = { version = "1",    features = ["full"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = { version = "1.0", features = ["preserve_order"] }  # Kev option order is load-bearing
anyhow      = "1.0"
inquire     = "0.7"
crossterm   = "0.25"  # same version inquire uses: single-key plan prompt
once_cell   = "1.19"
toml        = "0.8"
dirs        = "5.0"
uuid        = { version = "1.0", features = ["v4"] }
chrono      = "0.4"
which       = "6"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
