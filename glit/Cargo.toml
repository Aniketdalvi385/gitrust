[package]
name = "glit"
version = "0.1.0"
edition = "2021"
description = "Agentic Git CLI — natural language interface for Git operations"
license = "MIT"

[dependencies]
clap        = { version = "4.5",  features = ["derive"] }
git2        = "0.20"
libgit2-sys = { version = "0.18", features = ["vendored"] }
reqwest     = { version = "0.12", features = ["json"] }
tokio       = { version = "1",    features = ["full"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
anyhow      = "1.0"
inquire     = "0.7"
once_cell   = "1.19"
toml        = "0.8"
dirs        = "5.0"
uuid        = { version = "1.0", features = ["v4"] }
chrono      = "0.4"
which       = "6"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
