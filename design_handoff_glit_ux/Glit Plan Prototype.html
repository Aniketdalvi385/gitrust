<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glit · Plan Execution Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d0e;
    --panel: #14171a;
    --panel-2: #1a1e22;
    --term-bg: #0d1117;
    --term-bg-2: #12161b;
    --fg: #e8eaed;
    --fg-2: #b7bdc6;
    --dim: #6e7681;
    --dim-2: #4a525c;
    --rule: #22272e;
    --rule-2: #2d343c;
    --user: #79c0ff;
    --user-2: #a5d6ff;
    --green: #56d364;
    --yellow: #e3b341;
    --orange: #ff9d4a;
    --red: #ff7b72;
    --magenta: #d2a8ff;
    --accent: #ffd24a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); margin: 0; }
  body {
    font-family: "Geist", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }

  .app { max-width: 1280px; margin: 0 auto; padding: 32px 28px 64px; }

  /* ---------- header ---------- */
  .hdr { margin-bottom: 22px; }
  .hdr h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .hdr .sub {
    color: var(--dim);
    font-size: 13.5px;
    margin: 0;
  }
  .hdr .sub code {
    font-family: "Geist Mono", monospace;
    color: var(--user-2);
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
  }

  /* ---------- controls bar ---------- */
  .controls {
    display: flex;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 18px 0 20px;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-label {
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .seg {
    display: inline-flex;
    background: var(--term-bg);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 2px;
  }
  .seg button {
    background: transparent;
    border: 0;
    color: var(--fg-2);
    padding: 5px 11px;
    font-size: 12.5px;
    border-radius: 5px;
    transition: background 120ms, color 120ms;
  }
  .seg button.active {
    background: var(--rule-2);
    color: var(--fg);
  }
  .seg button:hover:not(.active) { color: var(--fg); }
  .ctrl-spacer { flex: 1; }
  .reset-btn {
    background: var(--accent);
    color: #1a1300;
    border: 0;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .reset-btn:hover { filter: brightness(1.08); }

  /* ---------- layout: terminal + legend ---------- */
  .main {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 18px;
    align-items: start;
  }

  /* ---------- terminal ---------- */
  .term {
    background: var(--term-bg);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }
  .term-head {
    background: var(--term-bg-2);
    border-bottom: 1px solid var(--rule);
    padding: 9px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .term-head .dots { display: flex; gap: 6px; }
  .term-head .dots i {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #3a3f47;
    display: inline-block;
  }
  .term-head .ttl {
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .term-head .badge {
    margin-left: auto;
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    color: var(--dim);
  }
  .term-head .badge.run { color: var(--accent); }
  .term-head .badge.done { color: var(--green); }
  .term-head .badge.failed { color: var(--red); }

  .term-body {
    padding: 18px 22px 22px;
    font-family: "Geist Mono", monospace;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--fg);
    flex: 1;
    overflow-y: auto;
  }
  .term-body > * + * { margin-top: 14px; }

  /* color helpers (echo critique doc) */
  .p { color: var(--dim); }
  .u { color: var(--user); }
  .d { color: var(--dim); }
  .g { color: var(--green); }
  .y { color: var(--yellow); }
  .o { color: var(--orange); }
  .r { color: var(--red); }
  .m { color: var(--magenta); }
  .b { color: var(--user-2); }
  .strong { color: var(--fg); font-weight: 600; }
  .head { color: var(--fg); font-weight: 600; }
  .caret { color: var(--accent); }

  .cursor {
    display: inline-block;
    width: 7px; height: 14px;
    background: var(--fg);
    vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- thinking stages ---------- */
  .stages { padding: 2px 0; }
  .stage {
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--fg-2);
  }
  .stage .icon { width: 14px; display: inline-block; }
  .stage.run .icon { color: var(--accent); animation: spin 1s linear infinite; }
  .stage.done .icon { color: var(--green); }
  .stage .label { flex: 1; }
  .stage .bud { color: var(--dim); font-size: 12px; }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ---------- timeline (lifted from critique doc) ---------- */
  .plan-block { }
  .plan-head {
    color: var(--fg);
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .plan-head .meta { color: var(--dim); font-weight: 400; font-size: 12.5px; }
  .timeline {
    position: relative;
    padding-left: 26px;
    margin: 0;
    list-style: none;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 8px;
    bottom: 8px;
    width: 1px;
    background: var(--rule-2);
  }
  .t-step {
    position: relative;
    padding-bottom: 12px;
  }
  .t-step:last-child { padding-bottom: 0; }
  .t-step .node {
    position: absolute;
    left: -25px;
    top: 6px;
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--rule-2);
    background: var(--term-bg);
    box-sizing: border-box;
    transition: background 200ms, border-color 200ms, box-shadow 200ms;
  }
  .t-step.done .node { background: var(--green); border-color: var(--green); }
  .t-step.done .node::after {
    content: "";
    position: absolute;
    left: 2px; top: 4px;
    width: 3px; height: 5px;
    border-right: 1.5px solid var(--term-bg);
    border-bottom: 1.5px solid var(--term-bg);
    transform: rotate(45deg);
  }
  .t-step.run .node {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 210, 74, 0.20);
    animation: tlPulse 1.4s ease-in-out infinite;
  }
  .t-step.failed .node {
    background: var(--red);
    border-color: var(--red);
  }
  .t-step.failed .node::after {
    content: "✗";
    position: absolute;
    left: 1px; top: -3px;
    color: var(--term-bg);
    font-size: 12px;
    font-weight: 700;
  }
  .t-step.skipped .node {
    background: var(--term-bg);
    border-color: var(--dim);
    border-style: dashed;
  }
  .t-step.skipped .t-card { opacity: 0.45; }
  .t-step.skipped .t-card .verb { text-decoration: line-through; }
  @keyframes tlPulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(255, 210, 74, 0.22); }
    50% { box-shadow: 0 0 0 8px rgba(255, 210, 74, 0.06); }
  }

  .t-card {
    background: var(--term-bg-2);
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 9px 14px;
    transition: border-color 160ms, background 160ms;
  }
  .t-step.focused .t-card {
    border-color: var(--accent);
    background: rgba(255, 210, 74, 0.06);
  }
  .t-card .row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .t-card .verb {
    color: var(--user-2);
    font-weight: 600;
    min-width: 60px;
  }
  .t-step.done .verb { color: var(--green); }
  .t-card .target { color: var(--fg); }
  .t-card .scope { color: var(--magenta); }
  .t-card .stat {
    color: var(--green);
    font-size: 12px;
    margin-left: auto;
  }
  .t-card .marker {
    color: var(--orange);
    margin-left: 4px;
    font-size: 13px;
  }
  .t-card .meta {
    color: var(--dim);
    font-size: 12px;
    margin-top: 3px;
  }
  .t-card .delta {
    color: var(--dim);
    font-size: 12px;
    margin-top: 3px;
  }
  .t-card .delta .from { color: var(--dim-2); }
  .t-card .delta .to { color: var(--yellow); }

  /* ---------- prompt rows ---------- */
  .prompt-row {
    padding-top: 6px;
    border-top: 1px dashed var(--rule);
    color: var(--fg-2);
    font-size: 13px;
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }
  .prompt-row .key {
    color: var(--accent);
    background: rgba(255, 210, 74, 0.10);
    border: 1px solid rgba(255, 210, 74, 0.30);
    border-radius: 4px;
    padding: 0 6px;
    font-family: "Geist Mono", monospace;
    font-size: 12px;
  }
  .prompt-row .sep { color: var(--dim-2); margin: 0 3px; }
  .prompt-row .ask {
    color: var(--accent);
    font-weight: 600;
    margin-right: 6px;
  }

  /* ---------- edit modal ---------- */
  .edit-card {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    margin-top: 8px;
  }
  .edit-card .lab {
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .edit-card textarea {
    width: 100%;
    background: var(--term-bg);
    color: var(--fg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: "Geist Mono", monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    min-height: 60px;
    outline: none;
  }
  .edit-card textarea:focus { border-color: var(--accent); }
  .edit-card .hint {
    color: var(--dim);
    font-size: 12px;
    margin-top: 8px;
  }
  .edit-card .hint .k {
    color: var(--accent);
    background: rgba(255, 210, 74, 0.10);
    border: 1px solid rgba(255, 210, 74, 0.30);
    border-radius: 3px;
    padding: 0 4px;
    font-family: "Geist Mono", monospace;
    font-size: 11px;
  }

  /* ---------- result blocks ---------- */
  .done-block, .canceled-block, .failed-block {
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
  }
  .done-block .ok {
    color: var(--green);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .canceled-block .x {
    color: var(--dim);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .failed-block .err {
    color: var(--red);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .failed-block .detail {
    color: var(--fg-2);
    font-size: 13px;
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .failed-block .next {
    color: var(--dim);
    font-size: 12.5px;
    margin-top: 8px;
  }
  .failed-block .next b {
    color: var(--green);
    font-weight: 500;
    font-family: "Geist Mono", monospace;
  }

  /* ---------- idle block ---------- */
  .idle {
    color: var(--dim);
    text-align: center;
    padding: 28px 0 12px;
  }
  .idle .big {
    color: var(--fg);
    font-size: 15px;
    margin-bottom: 6px;
  }
  .idle .small { font-size: 12.5px; }
  .idle .small .k {
    color: var(--accent);
    background: rgba(255, 210, 74, 0.10);
    border: 1px solid rgba(255, 210, 74, 0.30);
    border-radius: 3px;
    padding: 0 5px;
    font-family: "Geist Mono", monospace;
    font-size: 11px;
  }

  /* ---------- LEGEND ---------- */
  .legend {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 18px 18px 20px;
    position: sticky;
    top: 24px;
  }
  .legend h3 {
    font-size: 12px;
    font-family: "Geist Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 500;
    margin: 0 0 12px;
  }
  .legend h3:not(:first-child) { margin-top: 22px; }
  .legend .variant-name {
    color: var(--fg);
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .legend .variant-desc {
    color: var(--fg-2);
    font-size: 12.5px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .keymap { display: grid; gap: 6px; }
  .keymap .row {
    display: grid;
    grid-template-columns: 78px 1fr;
    align-items: baseline;
    gap: 10px;
    font-size: 12.5px;
    color: var(--fg-2);
  }
  .keymap .row .k {
    font-family: "Geist Mono", monospace;
    font-size: 11.5px;
    color: var(--accent);
    background: rgba(255, 210, 74, 0.10);
    border: 1px solid rgba(255, 210, 74, 0.30);
    border-radius: 4px;
    padding: 2px 6px;
    text-align: center;
  }
  .keymap .row .k.danger {
    color: var(--red);
    background: rgba(255, 123, 114, 0.10);
    border-color: rgba(255, 123, 114, 0.30);
  }
  .keymap .row .k.dim {
    color: var(--dim);
    background: transparent;
    border-color: var(--rule);
  }
  .snap {
    font-family: "Geist Mono", monospace;
    font-size: 12px;
    color: var(--fg-2);
  }
  .snap .sha { color: var(--yellow); }
  .snap .hint { color: var(--dim); font-size: 11.5px; margin-top: 4px; }

  .phase-pill {
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
    background: var(--term-bg);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 3px 8px;
    display: inline-block;
  }
  .phase-pill.run { color: var(--accent); border-color: rgba(255, 210, 74, 0.30); }
  .phase-pill.done { color: var(--green); border-color: rgba(86, 211, 100, 0.30); }
  .phase-pill.failed { color: var(--red); border-color: rgba(255, 123, 114, 0.30); }

  @media (max-width: 960px) {
    .main { grid-template-columns: 1fr; }
    .legend { position: static; }
  }
</style>
</head>
<body>

<div id="root"></div>
